<style>

:root{

  --pg-bg:#ECEBE6; --pg-fg:#17160F; --pg-mut:#6B6858; --pg-line:#D9D6C9; --pg-card:#F8F7F3; --pg-accent:#FFDD59; --pg-accent-fg:#17160F;

  --y:#FFDD59; --yd:#F5C400; --ys:#FFEB99; --yt:#FFF6D1; --bg:#FFFBEA; --sf:#FFFFFF; --sn:#F6F0DA; --ink:#141414; --i2:#4F4A3C; --mu:#8E8870; --ln:#EDE5C8;
  --co:#FF6B5B; --cos:#FFE0DB; --mi:#2FCB9F; --mis:#D5F7EA; --vi:#8B6CF0; --vis:#E7E0FD; --sk:#5BA8F5; --sks:#DCEEFF; --pk:#FF9EC4; --pks:#FFE2EE; --tan:#C4B09B;
  --disp:'Baloo 2','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}

:root[data-theme="dark"]{--pg-bg:#16150F;--pg-fg:#F3F1E6;--pg-mut:#A19E8A;--pg-line:#35332A;--pg-card:#201F17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--pg-bg);color:var(--pg-fg);font-family:var(--body);padding-inline:20px;padding-block:0 80px}
.wrap{max-width:1500px;margin:0 auto}
header.top{padding-block:40px 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
header.top h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1;margin:0 0 10px;letter-spacing:-.01em}
header.top p{margin:0;max-width:56ch;color:var(--pg-mut);font-size:16px;line-height:1.5}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches i{width:34px;height:34px;border-radius:12px;display:block;border:1px solid var(--pg-line)}
nav.flows{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pg-bg);display:flex;gap:8px;overflow-x:auto;padding-block:12px;border-block:1px solid var(--pg-line);margin-bottom:8px}
nav.flows a{flex:none;text-decoration:none;color:var(--pg-fg);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--pg-line);background:var(--pg-card)}
nav.flows a:hover,nav.flows a:focus-visible{background:var(--pg-accent);color:var(--pg-accent-fg);border-color:var(--pg-accent);outline:none}
section.flow{padding-block:48px 8px}
section.flow>h2{font-family:var(--disp);font-weight:800;font-size:30px;margin:0 0 4px}
section.flow>p{margin:0 0 24px;color:var(--pg-mut);max-width:70ch;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,390px);gap:36px 32px;justify-content:center}
figure.fx{margin:0;display:flex;flex-direction:column;gap:12px}
figure.fx figcaption{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--pg-mut)}
figure.fx figcaption b{color:var(--pg-fg)}
@media (max-width:440px){.grid{grid-template-columns:repeat(auto-fill,332px)}.phone{zoom:.85}}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;box-shadow:0 30px 60px -28px rgba(30,24,0,.45),0 0 0 1px rgba(0,0,0,.06);font-size:14px;line-height:20px}
.phone *{box-sizing:border-box}
.phone.yel{background:var(--y)}
.sb{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px 0 28px;font-weight:700;font-size:15px;position:relative;z-index:3}
.pb::-webkit-scrollbar{display:none}
.pb{flex:1;min-height:0;padding:8px 24px 24px;display:flex;flex-direction:column;gap:16px;position:relative}
.d{font-family:var(--disp);font-weight:800;font-size:44px;line-height:46px}
.h1{font-family:var(--disp);font-weight:800;font-size:30px;line-height:34px}
.h2{font-family:var(--disp);font-weight:700;font-size:22px;line-height:26px}
.h3{font-family:var(--disp);font-weight:700;font-size:18px;line-height:22px}
.bl{font-weight:600;font-size:16px;line-height:22px}
.bb{font-weight:700}
.l{font-weight:800;font-size:12px;line-height:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--i2)}
.c{font-weight:600;font-size:11px;line-height:14px}
.mu{color:var(--mu)} .i2{color:var(--i2)} .co{color:var(--co)} .ctr{text-align:center}
.row{display:flex;align-items:center;gap:var(--g,8px)} .col{display:flex;flex-direction:column;gap:var(--g,8px)} .grow{flex:1;min-width:0} .sp{justify-content:space-between} .wrapr{flex-wrap:wrap} .end{align-items:flex-end}
.ic{display:block;flex:none}
.circ{width:44px;height:44px;border-radius:50%;background:var(--sf);border:1.5px solid var(--ln);display:grid;place-items:center;flex:none;cursor:pointer;padding:0;color:var(--ink);font:inherit}
.circ.big{width:60px;height:60px}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:17px;border:0;cursor:pointer;width:100%;flex:none;color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn{white-space:nowrap;padding:0 16px}
.row>.btn{flex:1 1 0;width:auto;min-width:0}
.btn.p{background:var(--y);box-shadow:0 8px 20px rgba(245,196,0,.45)} .btn.s{background:var(--sf);box-shadow:inset 0 0 0 2px var(--ink)} .btn.k{background:var(--ink);color:#fff}
.btn.sm{width:auto;height:48px;padding:0 20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);font-weight:700;font-size:14px;cursor:pointer;border:0;color:var(--ink);font-family:var(--body);flex:none;line-height:20px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip.yl.on{background:var(--y);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 8px;border-radius:999px;font-weight:700;font-size:11px;line-height:14px;flex:none;white-space:nowrap}
.pill.nopad{padding-left:10px}
.card{background:var(--sf);border-radius:24px;box-shadow:0 4px 16px rgba(50,38,0,.08);padding:12px}
.tile{display:grid;place-items:center;flex:none;font-size:calc(var(--s)*.5);width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);line-height:1}
.mas{width:var(--s);height:var(--s);border-radius:36%;position:relative;flex:none}
.mas .e{position:absolute;width:14%;height:14%;background:var(--ink);border-radius:50%;top:36%} .mas .e1{left:27%} .mas .e2{left:59%}
.mas .mouth{position:absolute;width:30%;left:35%;top:56%;height:auto;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav{flex:none;background:var(--sf);border-radius:28px 28px 0 0;box-shadow:0 -4px 16px rgba(50,38,0,.08);padding:10px 14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.nav .tabs{display:flex;justify-content:space-between;align-items:center;width:100%}
.nav .tab{width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer}
.nav .tab i{width:52px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav .tab.on{color:var(--ink);font-weight:800} .nav .tab.on i{background:var(--y)}
.nav .fab{width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
.nav .fab i{width:60px;height:60px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.nav .hi{width:134px;height:5px;border-radius:3px;background:var(--ink)}
.field{height:56px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mu);font-weight:600;font-size:16px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--sn);padding:3px;display:flex;align-items:center;cursor:pointer;border:0;flex:none;transition:background .15s}
.switch::after{content:"";width:24px;height:24px;border-radius:50%;background:#fff;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--mi)} .switch.on::after{transform:translateX(22px)}
.dots{display:flex;gap:6px;align-items:center} .dots i{width:8px;height:8px;border-radius:4px;background:var(--ln)} .dots i.on{width:28px;background:var(--ink)}
.trk{height:10px;border-radius:5px;background:var(--sn);position:relative}
.trk b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--y)}
.trk u{position:absolute;top:-9px;width:28px;height:28px;border-radius:50%;background:var(--y);border:3px solid var(--ink);transform:translateX(-50%)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:32px 32px 0 0;padding:12px 24px 28px;display:flex;flex-direction:column;gap:14px;z-index:5}
.scrim{position:absolute;inset:0;background:rgba(20,20,20,.5);z-index:4}
.handle{width:44px;height:5px;border-radius:3px;background:var(--ln);align-self:center}
.seg{display:flex;background:var(--sn);border-radius:999px;padding:4px}
.seg button{flex:1;height:40px;border:0;background:none;border-radius:999px;font-weight:800;font-family:var(--body);font-size:14px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 2px 8px rgba(50,38,0,.12)}
.cf{position:absolute;display:block}
.tile.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.crave{border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border:0;text-align:left;font-family:var(--body);color:var(--ink);position:relative;height:96px;justify-content:flex-end}
.crave .em{font-size:34px;line-height:1}
.crave .ck{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--ink);display:none;place-items:center}
.crave.on{box-shadow:inset 0 0 0 3px var(--ink)} .crave.on .ck{display:grid}
.mood{border-radius:28px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:0;font-family:var(--body);color:var(--ink);font-weight:800;font-size:13px}
.mood.on{box-shadow:inset 0 0 0 3px var(--ink)}
.map{position:relative;overflow:hidden;background:#F3EDD0}
.map .rd{position:absolute;background:#fff;border-radius:6px}
.map .wt{position:absolute;background:var(--sks);border-radius:40px}
.map .pk{position:absolute;background:var(--mis);border-radius:28px}
.map .bk{position:absolute;background:#EADFB5;border-radius:10px}
.pin{position:absolute;width:44px;height:44px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 6px 14px rgba(40,30,0,.3);border:3px solid #fff}
.pin span{transform:rotate(45deg);font-size:20px;line-height:1}
.me{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--sk);border:4px solid #fff;box-shadow:0 0 0 8px rgba(91,168,245,.25)}
.bar{height:8px;border-radius:4px;background:var(--sn);overflow:hidden;flex:1} .bar b{display:block;height:100%;background:var(--y);border-radius:4px;transition:width .3s}
.star{display:inline-flex;gap:2px}
.rate{display:flex;gap:6px}.rate button{border:0;background:none;padding:0;cursor:pointer;line-height:0}
.dash{border:2px dashed var(--ln);border-radius:20px}
.vote{transition:transform .12s} .vote:active{transform:scale(.98)}
.t{display:flex;gap:6px}.t button{font-family:var(--disp)}
.tabs2{display:flex;gap:6px;background:var(--sn);border-radius:16px;padding:4px}.tabs2 span{flex:1;text-align:center;padding:8px 0;border-radius:12px;font-weight:800;font-size:13px;color:var(--mu)}.tabs2 span.on{background:var(--sf);color:var(--ink);box-shadow:0 2px 6px rgba(50,38,0,.1)}
.wheelbox{position:relative;width:342px;height:372px}
.wheelbox .ptr{position:absolute;left:151px;top:0;z-index:2}
.wheelbox svg.w{position:absolute;left:6px;top:34px}
#wg{transform-origin:165px 165px;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
@media (prefers-reduced-motion:reduce){#wg{transition:none}.btn,.vote{transition:none}}
.btn:focus-visible,.chip:focus-visible,.circ:focus-visible,.crave:focus-visible,.mood:focus-visible,.switch:focus-visible,.seg button:focus-visible{outline:3px solid var(--vi);outline-offset:2px}
.note{margin-top:56px;padding:20px;border-radius:20px;background:var(--pg-card);border:1px solid var(--pg-line);display:grid;gap:8px;max-width:78ch;margin-inline:auto}
.note h3{margin:0;font-family:var(--disp);font-size:20px}.note p{margin:0;color:var(--pg-mut);line-height:1.55}

html{color-scheme:light}body{padding:0;margin:0;min-height:100vh;display:flex;background:#FFF6D1}
#side{width:280px;flex:none;padding:28px 20px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--pg-line);height:100vh;position:sticky;top:0;overflow:auto}
#side h1{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1;margin:0}
#side p{margin:0;color:var(--pg-mut);font-size:14px;line-height:1.45}
#list{display:flex;flex-direction:column;gap:4px}
#list button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--pg-fg);font:inherit;font-weight:700;font-size:14px;padding:8px 10px;border-radius:12px;cursor:pointer}
#list button b{font-family:var(--disp);width:24px;color:var(--pg-mut)}
#list button:hover{background:var(--pg-card)} #list button.on{background:var(--pg-accent);color:var(--pg-accent-fg)} #list button.on b{color:inherit}
#restart{border:1.5px solid var(--pg-line);background:var(--pg-card);color:var(--pg-fg);font:inherit;font-weight:700;padding:10px;border-radius:999px;cursor:pointer}
#stage{flex:1;display:grid;place-items:center;min-width:0;min-height:100vh}
#holder{position:relative}
#frame{width:390px;height:844px;position:absolute;left:0;top:0;transform-origin:0 0;border-radius:44px;overflow:hidden}
#screen{width:390px;height:844px}
#screen.in{animation:in .24s ease-out}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
.trk{touch-action:none;cursor:pointer}.trk::before{content:"";position:absolute;inset:-16px 0}
.phone{box-shadow:none}
input{font-family:var(--body)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}
.field input::placeholder{color:var(--mu)}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
body.m{display:block}body.m #frame{border-radius:0}body.m #stage{min-height:100vh}
@media (max-width:900px){#side{display:none}}
img.em{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin:0 .04em;pointer-events:none;user-select:none}
</style></head><body>

function emojify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[];let n;
  while(n=w.nextNode()){if(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA|text)$/.test(n.parentNode.nodeName))continue;EMO_RE.lastIndex=0;if(EMO_RE.test(n.nodeValue))list.push(n)}
  list.forEach(t=>{const f=document.createDocumentFragment();let last=0;const v=t.nodeValue;EMO_RE.lastIndex=0;let m;
    while(m=EMO_RE.exec(v)){f.append(v.slice(last,m.index));const i=document.createElement('img');i.src='assets/emoji/'+eimg(m[0])+'.png';i.alt=m[0];i.draggable=false;i.className='em';f.append(i);last=m.index+m[0].length}
    f.append(v.slice(last));t.parentNode.replaceChild(f,t)});
}

 if(id==='08'){wireNav(root);const back=()=>go('07');$('.scrim',root).onclick=back;btnBy(root,'Show 12 places').onclick=back;tapNext(textBy(root,'span','Reset'),()=>{$$('.sheet .chip',root).forEach(c=>c.classList.remove('on'));$$('.sheet .switch',root).forEach(c=>c.classList.add('on'))})}
 if(id==='09'){circBy(root,'x').onclick=()=>go('06');circBy(root,'edit').onclick=()=>go('10');tapNext(textBy(root,'span','· Edit'),()=>go('10'));
  const g=$('#wg',root),b=$('#spinbtn',root),r=$('#wres',root),n=wheelItems.length,st=360/n;
  const wc=g.closest('svg');if(wc){wc.style.cursor='pointer';wc.addEventListener('click',()=>{if(!b.disabled)b.click()})}
  b.onclick=()=>{const i=Math.floor(Math.random()*n);const diff=((-i*st-state.wheelRot)%360+360)%360;state.wheelRot+=360*5+diff;g.style.transform=`rotate(${state.wheelRot}deg)`;r.textContent='Spinning…';b.disabled=true;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
   setTimeout(()=>{const it=ITEMS.filter(x=>x.on)[i];state.res=it;r.textContent=it.e+' '+it.name+'!';setTimeout(()=>go('11'),rm?0:900)},rm?0:4300)}}
 if(id==='10'){circBy(root,'left').onclick=()=>go('09');

  $('[data-selall]',root).onclick=()=>{const all=ITEMS.every(x=>x.on);ITEMS.forEach((x,i)=>x.on=all?(i<2?1:0):1);render('10')};
  const ab=btnBy(root,'+ Add your own');ab.onclick=()=>{$('#addbox',root).innerHTML='<div class="row" style="--g:8px"><div class="field grow" style="height:56px;padding:0 16px"><input id="own" maxlength="18" placeholder="e.g. Hokkien mee" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)" aria-label="New food"></div><button class="btn p sm" id="addgo" style="width:90px">Add</button></div>';const inp=$('#own',root);inp.focus();const add=()=>{const v=inp.value.trim();if(!v)return;ITEMS.push(mk('🍴',v,v,'ys',1,'Your pick, your rules. 🍴',[[v+' House','6 min',4.4,'🍴','ys'],['Local favourite','9 min',4.2,'🍽️','mis']]));render('10');setTimeout(()=>{const s=$('.pb',scr);s.scrollTop=s.scrollHeight},0)};$('#addgo',root).onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()}}}
 if(id==='12'){const it=state.res||ITEMS[2],k=Math.min(state.mapI||0,it.spots.length-1);$('[data-back]',root).onclick=()=>go('11');
  $$('[data-pin]',root).forEach(p=>p.onclick=()=>{state.mapI=+p.dataset.pin;render('12')});

  const g=$('#go12',root);g.onclick=()=>{if(g.dataset.on){toast('Enjoy your '+it.short.toLowerCase()+'! 🎉');return}g.dataset.on=1;g.textContent='I’ve arrived';$('#mname',root).insertAdjacentHTML('afterend','<span class="c mu">Walking now…</span>');toast('Walking to '+it.spots[k][0])}}
 if(id==='11'){$('[data-back]',root).onclick=()=>go('09');btnBy(root,'Spin again').onclick=()=>{go('09');setTimeout(()=>{const b=$('#spinbtn');b&&b.click()},450)};
  const it=state.res||ITEMS[2];btnBy(root,'Take me there').onclick=()=>{state.mapI=0;go('12')};
  $('[data-seemap]',root).onclick=()=>{state.mapI=0;go('12')};$$('[data-spot]',root).forEach((s,i)=>s.onclick=()=>{state.mapI=i;go('12')})}

document.addEventListener('click',e=>{
 const j=e.target.closest('[data-jump]');if(j){go(j.dataset.jump);return}
 if(e.target.closest('#restart')){state.name='Claire';state.res=null;state.filter='All';state.deckI=2;go('01');return}
 const o=e.target.closest('[data-one]');if(o){$$('[data-one]',o.closest('.row')||scr).forEach(x=>x.classList.remove('on'));o.classList.add('on');return}
 const t=e.target.closest('[data-toggle]');if(t){t.classList.toggle('on');return}
 const sw=e.target.closest('[data-switch]');if(sw&&!sw.closest('[data-item]')){sw.classList.toggle('on');return}
 const h=e.target.closest('[data-heart]');if(h){const on=h.dataset.on!=='1';h.dataset.on=on?'1':'0';h.innerHTML=`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="${on?'#FF6B5B':'none'}" stroke="${on?'#FF6B5B':'#141414'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.heart}</svg>`}
});
addEventListener('hashchange',()=>render(location.hash.slice(1)));addEventListener('resize',fit);
fit();render(ORDER.includes(location.hash.slice(1))?location.hash.slice(1):'01');
